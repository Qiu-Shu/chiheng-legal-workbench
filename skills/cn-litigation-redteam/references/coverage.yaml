  status: "experimental"
  statement: "吉林和松原首页可读；长春HTTPS失败，HTTP栏目外壳仅隔离观察；地方规范全文覆盖尚未建成"
public_legal_index:
  status: "experimental"
  statement: "本机共享旧法规镜像；民法典及六部基础法官方原件已隔离入库并完成所记录的机械校验；动态数量和人工审核状态以服务实测为准，不宣称全国完整"
scrapling_runtime:
  status: "local_smoke_passed"
  statement: "本机0.4.15静态、动态、外网实测通过；依赖不内嵌分发包"
